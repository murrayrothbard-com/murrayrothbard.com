name: Fetch test
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/fetch-test.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check cdn.mises.org reachability
        run: |
          for u in "https://cdn.mises.org/Economic%20Controversies_2.epub" "https://cdn.mises.org/Economic%20Controversies_2.pdf"; do
            echo "$u"; curl -sS -I -m 30 -A "murrayrothbard.com catalog builder (+https://github.com/murrayrothbard-com/murrayrothbard.com)" "$u" | head -8 || true
          done
